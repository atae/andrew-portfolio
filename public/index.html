<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- GitHub Pages SPA redirect -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          });
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded[0] + (decoded[1] || '') + l.hash
          );
        }
      }(window.location))
    </script>

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#78290f" />

    <title>Andrew Tae</title>
    <meta name="description" content="Andrew Tae — Senior frontend engineer and musician based in Oakland, CA. React, TypeScript, Next.js." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.andrewtae.com" />
    <meta property="og:title" content="Andrew Tae" />
    <meta property="og:description" content="Senior frontend engineer and musician based in Oakland, CA. React, TypeScript, Next.js." />
    <meta property="og:image" content="https://www.andrewtae.com/images/headshot.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Andrew Tae" />
    <meta name="twitter:description" content="Senior frontend engineer and musician based in Oakland, CA. React, TypeScript, Next.js." />
    <meta name="twitter:image" content="https://www.andrewtae.com/images/headshot.jpg" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>

    <div id="root"></div>
  </body>
</html>
